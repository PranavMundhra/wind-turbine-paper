name: paper
on: [push, pull_request]
jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pranavmundhra/wind-turbine
          path: _code
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyyaml
      - name: Grounding check (errors fail the build; warnings are listed)
        run: PAPER_CODE_REPO=_code python tools/paper.py check --lenient
      - name: Build PDF
        uses: xu-cheng/latex-action@v3
        with: { root_file: main.tex }
      - uses: actions/upload-artifact@v4
        with: { name: paper-pdf, path: main.pdf }
